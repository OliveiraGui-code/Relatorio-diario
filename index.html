<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio Direto 🛴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rota do dia</h1>
    <details class="cartao">
        <summary>＋ Adicionar zona ou tarefa</summary>
         
        <div class="campo-add">
            <input type="text" id="nova-zona" placeholder="Nova zona">
            <button id="btn-add-zona">Adicionar zona</button>
        </div>

        <div class="campo-add">
            <input type="text" id="nova-tarefa" placeholder="Nova tarefa">
            <button id="btn-add-tarefa">Adicionar tarefa</button>
        </div>
    </details>

    <div id="area-principal">
        <div id="coluna-zonas" class="cartao">
            <h2>Zonas:</h2>
            <button id="btn-editar">Editar</button>
        <div id="lista-zonas"></div>
    </div>

    <div id="painel-zona" class="cartao" hidden>
        <h2 id="titulo-zona"></h2>
            <div id="lista-tarefas"></div>
            <textarea id="observacao" placeholder="Observação (Opcional)"></textarea>
            <button id="btn-guardar">Guardar</button>
            <button id="btn-desfazer">Desfazer zona</button>
    </div>
    </div>

    <div class="cartao">
        <h2>Gerir tarefas</h2>
        <div id="lista-gerir-tarefas"></div>
    </div>

    <div class="cartao">
        <h2>Relatório</h2>
        <button id="btn-gerar">Gerar relatório</button>
        <textarea id="texto-relatorio" rows="10" placeholder="O relatório aparece aqui"></textarea>

    <div class="acoes">
        <button id="btn-copiar">Copiar</button>
        <button id="btn-whatsapp">Enviar por WhatsApp</button>
    </div>

        <button id="btn-limpar">Limpar dia</button>
    </div>

<script src="app.js"></script>

<footer>
    <p>Criado por: Guilherme Oliveira</p>
    <p>
        <a href="https://www.linkedin.com/in/guilherme-oliveira-log/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        ·
        <a href="https://github.com/OliveiraGui-code/relatorio-diario" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
</footer>

</body>
</html>
