<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio Direto 🛴</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rota do dia</h1>
        <div id="area-principal">
        <div id="coluna-zonas">
            <input type="text" id="nova-zona" placeholder="Nova zona">
            <button id="btn-add-zona">Adicionar zona</button>
            <h2>Zonas:</h2>
            <button id="btn-editar">Editar</button>
            <div id="lista-zonas"></div>
        </div>

            <div id="painel-zona" hidden>
            <h2 id="titulo-zona"></h2>
            <div id="lista-tarefas"></div>
            <textarea id="observacao" placeholder="Observação (Opcional)"></textarea>
            <button id="btn-guardar">Guardar</button>
        </div>
    </div>


    <h2>Relatório</h2>
    <button id="btn-gerar">Gerar relatório</button>
    <textarea id="texto-relatorio" rows="10" placeholder="O relatório aparece aqui"></textarea>
    <button id="btn-copiar">Copiar</button>
    <button id="btn-whatsapp">Enviar por WhatsApp</button>
    <button id="btn-limpar">Limpar dia</button>

    <script src="app.js"></script>

</body>
</html>
